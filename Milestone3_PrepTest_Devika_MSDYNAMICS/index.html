<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Citizen Service portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="bg-dark text-white p-3">
        <div clas="container d-flex justify-content-between">
            <h3>Smart City</h3>
            <nav>
                <button class="btn btn-light btn-sm" onclick="showSection('home')">Home</button>
                <button class="btn btn-light btn-sm" onclick="showSection('services')">Services</button>
                <button class="btn btn-light btn-sm" onclick="showSection('request')">Request</button>
                <button class="btn btn-light btn-sm" onclick="showSection('status')">Status</button>

            </nav>
        </div>
    </header>
    <main class="container mt4">
        <!--HERO-->
        <section id="home">
            <h1>Welcome to Smart City Services</h1>
            <p>Request city services easily online.</p>
            <button class="btn btn-primary" onclick="showSection('request')">Raise a Request</button>
        </section>
        <!-- Services -->
         <section id="services" class="d-none">
            <h2>Services</h2>
            <div class="row" id="serviceCards"></div>
         </section>
         <!-- Request form -->
          <section id="request" class="d-none">
            <h2>Service Request</h2>
            <form id="requestForm">
                <input class="form-control mb-2" id="name" placeholder="Name" />
                <input class="form-control mb-2" id="email" placeholder="Email" />
                <select class="form-control mb-2" id="service">
                    <option value="">Select Service</option>
                    <option>Water</option>
                    <option>Electricity</option>
                    <option>Road</option>
                </select>
                <textarea class="form-control mb-2" id="description" placeholder="Description"></textarea>
                <button type="submit" class="btn btn-success">Submit</button>

            </form>
            <p id="message" class="mt-2"></p>
          </section>
          <!-- Status -->
           <section id="status" class="d-none">
            <h2>Request Status</h2>
            <ul id="statusList"></ul>
           </section>
    </main>
    <footer class="bg-dark text-white text-center p-2 mt-4">2026 Smart City Portal</footer>
    <script src="./script.js"></script>
    
</body>
</html>
