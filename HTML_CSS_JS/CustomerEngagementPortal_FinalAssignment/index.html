<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Engagement Portal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Customer Portal</a>
    </div>
  </nav>
</header>

<main class="container my-4">

  <!-- Inline & Block -->
  <section>
    <h2>Welcome</h2>
    <p>This is a <span class="highlight">responsive</span> customer engagement portal.</p>
  </section>

  <!-- Bootstrap Cards -->
  <section class="row">
    <div class="col-md-4">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">Support</h5>
          <p class="card-text">24/7 customer support.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Form -->
  <section>
    <h3>User Information</h3>
    <form id="userForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" id="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <button class="btn btn-primary">Submit</button>
    </form>
  </section>

  <!-- Media -->
  <section id="media" class="mb-5">
  <h2>Media Section</h2>

  <p>Audio Player:</p>
<audio controls>
  <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
  
</audio>

  <p class="mt-3">Video Player:</p>
  <video width="320" controls>
    <source src="https://www.w3schools.com/tags/mov_bbb.mp4" type="video/mp4">

  </video>
</section>


</main>

<footer class="text-center bg-light p-3">
  <p>&copy; 2026 Customer Engagement Portal</p>
</footer>

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
